  -D WLED_PRODUCT_NAME="\"Dig-Uno-V3-AEPlus\""
  -D SERVERNAME="\"Dig-Uno-V3-AEPlus\""
  -D WLED_RELEASE_NAME="\"Dig-Uno-V3-AEplus\""
  ${digboards.build_flags_dig_uno_aeplus}
  ${digboards.build_flags_dig_ar_aeplus}
  ${digboards.build_flags_temperature}
  ${esp32.AR_build_flags}
lib_deps = ${esp32.lib_deps}
  ${digboards.lib_deps_temperature}
  ${esp32.AR_lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
extra_scripts = ${scripts_defaults.extra_scripts}

# ------------------------------------------------------------------------------------------
# QuinLED Dig-Uno v4 (QuinLED-ESP32 module: ESP32-PICO-MINI-02U, 8MB flash + 2MB PSRAM)
# Standard build: no relay usermod. Q1 (GPIO32) uses WLED's built-in relay feature and
# drives the external Q1R relay; the board has no internal relay MOSFETs.
# 2 LED outputs (GPIO2/4) with 30 WS2812B LEDs each, one segment per output,
# brightness limiter 5000mA, WLED button on GPIO37, onboard PDM microphone (enabled by default),
# ethernet (LAN8720: MDC=7, MDIO=8, clock in on GPIO0), Dallas temperature sensor on GPIO20.
# Q2/Q3/Q4 (GPIO33/13/15) are not assigned.
# ------------------------------------------------------------------------------------------
[env:dig-Uno-V4]
board = esp32dev
platform = ${esp32_idf_V4.platform}
upload_speed = 921600
board_build.flash_mode = dio
board_build.partitions = ${esp32.large_partitions}
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
custom_usermods = audioreactive Temperature
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0          ;; mandatory for classic ESP32 on arduino-esp32 >=2.0.3
  -D BOARD_HAS_PSRAM
  -D WLED_BRAND="\"QuinLED\""
  -D WLED_PRODUCT_NAME='"Dig-Uno v4"'
  -D SERVERNAME='"Dig-Uno v4"'
  -D WLED_RELEASE_NAME="\"Dig-Uno-v4\""  ;; no spaces: used for OTA matching and GitHub asset names
  -D NOWIFISLEEP=false
  -D WLED_DISABLE_BLYNK
  -D BTNPIN=37
  -D IRPIN=-1
  -D DATA_PINS=2,4
  -D LED_TYPES=TYPE_WS2812_RGB
  -D PIXEL_COUNTS=30,30
  -D WLED_AUTOSEGMENTS                  ;; one segment per LED output by default
  -D ABL_MILLIAMPS_DEFAULT=5000
  ;; audioreactive: onboard PDM microphone, enabled by default
  -D UM_AUDIOREACTIVE_ENABLE
  -D SR_DMTYPE=5
  -D I2S_WSPIN=5
  -D I2S_SDPIN=38
  -D I2S_CKPIN=-1
  -D SR_SQUELCH=10
  -D SR_GAIN=30
  -D I2S_USE_16BIT_SAMPLES
  ;; ethernet
  -D WLED_USE_ETHERNET
  -D WLED_ETH_DEFAULT=WLED_ETH_QUINLED_V4_UNOQUAD
  ;; Dallas temperature sensor
  -D USERMOD_DALLASTEMPERATURE
  -D TEMPERATURE_PIN=20
  ;; Q1 (GPIO32, external Q1R relay) via WLED's built-in relay feature (no relay usermod)
  -D RLYPIN=32
lib_deps = ${esp32_idf_V4.lib_deps}
  OneWire@~2.3.5
  milesburton/DallasTemperature@^3.9.0
monitor_filters = esp32_exception_decoder
extra_scripts = ${scripts_defaults.extra_scripts}


#
#
# Dig2Go
#
#
[env:dig2go]
board_build.flash_mode = dio
custom_usermods = audioreactive multi_relay
board = esp32dev
platform = ${esp32.platform}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32.build_flags}
  ${digboards.build_flags_quinled}
  -D WLED_BRAND="\"QuinLED\""
  -D WLED_PRODUCT_NAME="\"Dig2Go-Audioreactive\""
  -D SERVERNAME="\"Dig2Go-AR\""
  -D WLED_RELEASE_NAME="\"Dig2Go-Audioreactive\""
  -D WLED_DISABLE_BLYNK
  -D UM_AUDIOREACTIVE_ENABLE
  -D IR_ENABLE_DEFAULT=true
  -D LEDPIN=16
  -D PIXEL_COUNTS=300
  -D ABL_MILLIAMPS_DEFAULT=1250
  -D USERMOD_MULTI_RELAY
  -D MULTI_RELAY_MAX_RELAYS=4
  -D MULTI_RELAY_PINS=12,-1,-1,-1
  -D BTNPIN=0
  -D IRPIN=5
  -D DMENABLED=1
  ${esp32.AR_build_flags}
  -D SR_DMTYPE=1
  -D I2S_SDPIN=19
  -D I2S_WSPIN=4
  -D I2S_CKPIN=18 
  -D SR_SQUELCH=10
  -D SR_GAIN=30
lib_deps = ${esp32.lib_deps}
  ${esp32.AR_lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
extra_scripts = ${scripts_defaults.extra_scripts}