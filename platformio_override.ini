# ------------------------------------------------------------------------------------------
# QuinLED Dig-Octa v4 Brainboard (ESP32-WROOM-32E-N16, 16MB flash)
# 8 LED outputs (GPIO1/2/3/4/5/12/13/14) with 30 WS2812B LEDs each, one segment per output,
# brightness limiter 5000mA, 2 buttons (GPIO34/35), relay output on GPIO33 (built-in relay pin),
# onboard PDM microphone (SCK=GPIO17, SD=GPIO39, enabled by default),
# ethernet (LAN8720: MDC=23, MDIO=18, clock in on GPIO0).
# The SD card pins are repurposed: I2C (SDA=GPIO32, SCL=GPIO16) is the default
# configuration since WLED does not use SD cards. SHT temp sensor supported on I2C.
# ------------------------------------------------------------------------------------------
[env:dig-Octa-V4]
board = esp32dev
platform = ${esp32_idf_V4.platform}
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
custom_usermods = audioreactive sht
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0          ;; mandatory for classic ESP32 on arduino-esp32 >=2.0.3
  -D WLED_BRAND="\"QuinLED\""
  -D WLED_PRODUCT_NAME='"Dig-Octa v4"'
  -D SERVERNAME='"Dig-Octa v4"'
  -D WLED_RELEASE_NAME="\"Dig-Octa-v4\""  ;; no spaces: used for OTA matching and GitHub asset names
  -D NOWIFISLEEP=false
  -D WLED_DISABLE_BLYNK
  -D BTNPIN=34,35,-1,-1
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_PUSH,BTN_TYPE_PUSH,BTN_TYPE_PUSH
  -D IRPIN=-1
  -D DATA_PINS=1,2,3,4,5,12,13,14
  -D LED_TYPES=TYPE_WS2812_RGB
  -D PIXEL_COUNTS=30,30,30,30,30,30,30,30
  -D WLED_AUTOSEGMENTS                  ;; one segment per LED output by default
  -D ABL_MILLIAMPS_DEFAULT=5000
  ;; I2C header (SD card pins repurposed; WLED does not use SD cards)
  -D I2CSDAPIN=32
  -D I2CSCLPIN=16
  ;; SHT temperature sensor (I2C add-on)
  -D USERMOD_SHT
  ;; audioreactive: onboard PDM microphone, enabled by default
  -D UM_AUDIOREACTIVE_ENABLE
  -D SR_DMTYPE=5
  -D I2S_WSPIN=17
  -D I2S_SDPIN=39
  -D I2S_CKPIN=-1
  -D SR_SQUELCH=10
  -D SR_GAIN=30
  -D I2S_USE_16BIT_SAMPLES
  ;; ethernet
  -D WLED_USE_ETHERNET
  -D WLED_ETH_DEFAULT=WLED_ETH_QUINLED_V4_OCTA
  ;; relay output on GPIO33 via WLED's built-in relay feature (no relay usermod)
  -D RLYPIN=33
lib_deps = ${esp32_idf_V4.lib_deps}
  robtillaart/SHT85@~0.3.3
monitor_filters = esp32_exception_decoder
extra_scripts = ${scripts_defaults.extra_scripts}



